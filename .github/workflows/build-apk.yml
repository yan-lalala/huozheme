name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy APK to Public Directory
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/huozheme-companion.apk
          ls -lh public/huozheme-companion.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huozheme-companion-apk
          path: public/huozheme-companion.apk

      - name: Commit and Push APK to Master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin master --rebase || true
          git add public/huozheme-companion.apk
          git commit -m "chore(release): update compiled huozheme-companion.apk [skip ci]" || echo "No changes to commit"
          git push origin master
